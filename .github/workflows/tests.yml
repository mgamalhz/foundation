name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, mbstring
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/pint --test
      - run: vendor/bin/pest
      - run: composer audit
